# Check all platforms and features, including development dependencies.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
include-dev = true
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.95

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
