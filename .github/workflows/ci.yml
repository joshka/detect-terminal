name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Preserve every main revision: these checks gate publication in the release workflow.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@1.58.0,rumdl@0.2.77
      - run: just fmt-check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    defaults:
      run:
        shell: bash
    env:
      TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.88.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
      - run: cargo "+$TOOLCHAIN" test --workspace --all-features --locked
      - run: cargo "+$TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs-and-package:
    name: Documentation and packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@1.58.0
          fallback: none # Accept only checksummed tools, without an install token.
      - run: cargo install cargo-docs-rs --version 1.0.4 --locked
      - run: just docs docs-private docs-rs package

  security:
    name: Workflow and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@1.58.0,zizmor@1.32.0,cargo-deny@0.20.2
          fallback: none # Accept only checksummed tools, without an install token.
      - run: just zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just deny

  # Checks that .github/workflows/actions.lock matches the workflows. To add or update an action, or
  # fix a failure here, see docs/github-actions.md.
  lockfile:
    name: Actions lockfile
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
      - run: gh actions-lock --verify
