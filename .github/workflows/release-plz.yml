name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    if: github.repository == 'joshka/detect-terminal' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Every release commit must run; a concurrency group can discard pending releases.
  release:
    name: Publish crates # zizmor: ignore[concurrency-limits]
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write # Create release tags and GitHub releases.
      pull-requests: read # Identify merged release PRs.
      id-token: write # Authenticate to crates.io through OIDC.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-pr:
    name: Prepare release PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Push the release branch.
      pull-requests: write # Create and update release PRs.
      actions: write # Dispatch CI on the release PR branch.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Explicit dispatch runs CI on bot-created PRs without a personal access token.
      - name: Check release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"
