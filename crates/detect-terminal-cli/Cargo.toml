[package]
name = "detect-terminal-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde_json = "1.0.145"
detect-terminal = { path = "../detect-terminal" }

[[bin]]
name = "detect-terminal"
path = "src/main.rs"
# The library owns the same Rustdoc name; CLI usage is documented in README and --help.
doc = false
